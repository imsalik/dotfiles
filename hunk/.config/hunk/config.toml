theme = "custom"
mode = "stack"
line_numbers = true
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

# Let ghostty's background-opacity = 0.95 show through instead of an opaque fill.
transparent_background = true

# Follow the herdr / ghostty look: Catppuccin Mocha, magenta (mauve) accent,
# pink cursor. hunk has no numeric opacity; transparency is ghostty's job.
[custom_theme]
base = "catppuccin-mocha"
accent = "#cba6f7"       # mauve — herdr accent = "magenta"
border = "#45475a"       # surface1
panel = "#181825"        # mantle
panelAlt = "#11111b"     # crust
