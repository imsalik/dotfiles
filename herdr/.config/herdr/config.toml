onboarding = false

[theme]
name = "terminal"

auto_switch = false
[theme.custom]
surface_dim = "#2a3350"

[keys]
# Run herdr OUTSIDE tmux — ctrl+a is tmux's prefix too
prefix = "ctrl+a"
detach = "prefix+d"
rename_tab = "prefix+comma"
split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'

# Session navigator moved off prefix+g so lazygit can have it;
# prefix+p and prefix+o freed for the ports/lazygit popups
# Unbound by default. Direct chord, not prefix+shift+1..9: shift+5 sends %,
# which would collide with split_vertical.
switch_workspace = "ctrl+shift+1..9"
# prefix+o now opens the custom sessionx-style workspace switcher popup
# (goto.sh, bound below as a [[keys.command]]). The built-in tree navigator
# moved to prefix+i so it's still available.
goto = "prefix+i"
open_notification_target = "prefix+shift+o"
previous_tab = "prefix+p"
# displaced by the shift popups below
rename_pane = 'prefix+<'
new_worktree = "prefix+g"

# ctrl+h/j/k/l pane focus is routed through vim-herdr-navigation (see
# [[keys.command]] below) so it crosses seamlessly into nvim splits.

# Unbound by default; arrows avoid prefix+shift+k (kate)
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

# sessionx-style workspace switcher. Own repo ~/personal/herdr-goto (linked plugin),
# run here as a popup via the herdr-goto PATH symlink -> ~/personal/herdr-goto/goto.sh.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "herdr-goto"
description = "goto (workspace switcher)"
width = "90%"
height = "85%"

# Same switcher, opened straight into the agents scope (Tab still cycles).
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "herdr-goto agent"
description = "goto (agent switcher)"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "ports"
description = "ports"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "kate"
description = "kate (kubernetes)"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

# floating scratch shell (session-modal, closes when the shell exits)
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
description = "scratch shell"
width = "80%"
height = "80%"

# Seamless nvim<->herdr pane focus. navigate.sh forwards into nvim when the
# focused pane runs vim, else moves herdr focus.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "nav: focus left (nvim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "nav: focus down (nvim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "nav: focus up (nvim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "nav: focus right (nvim-aware)"

[[keys.command]]
key = "prefix+shift+h"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle pane"

[ui]
window_title = "{hostname}: {workspace}"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
accent = "magenta"
copy_on_select = false

sidebar_width = 30
sidebar_max_width = 38
prompt_new_tab_name = true
hide_tab_bar_when_single_tab = true

# Right-aligned tab bar entries (0.8.2+). zoom shows a pill when a pane is
# zoomed. datetime is 12h (%-I drops the leading zero).
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%a %-I:%M %p" },
]
tab_bar_right_separator = "  ·  "

# Catppuccin Mocha hex; fg takes literal hex only, and a bad value silently
# reverts the whole table to defaults. Verify with `herdr config check`.
# git_status is left unstyled on purpose: an fg override would collapse its
# built-in green-ahead / red-behind colors into one.
status_indicators = "symbols"
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", fg = "#cba6f7" }, "git_status"],
]

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "workspace", bold = true }, "tab"],
  ["state_text", { token = "agent", dim = true }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", { token = "workspace", bold = true }, "tab"],
  [{ token = "terminal_title_stripped", fg = "#f5c2e7" }],
  ["state_text", { token = "$model", dim = true }],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

# tmux ran status-position top; keep notifications on the same edge.
[ui.toast.herdr]
position = "top-right"

[experimental]
pane_history = false

[update]
channel = "preview"
