onboarding = false

[theme]
name = "catppuccin"

[keys]
# Run herdr OUTSIDE tmux — ctrl+a is tmux's prefix too
prefix = "ctrl+a"
detach = "prefix+d"
rename_tab = "prefix+comma"
split_vertical = 'prefix+%'
split_horizontal = 'prefix+"'

# Session navigator moved off prefix+g so lazygit can have it;
# prefix+p and prefix+o freed for the ports/lazygit popups
# Unbound by default. Direct chord, not prefix+shift+1..9: shift+5 sends %,
# which would collide with split_vertical.
switch_workspace = "ctrl+shift+1..9"
goto = "prefix+o"
open_notification_target = "prefix+shift+o"
previous_tab = "prefix+p"
# displaced by the shift popups below
rename_pane = 'prefix+<'
new_worktree = "prefix+g"

# Prefix-based so nvim keeps ctrl+h/j/k/l for its own splits
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Unbound by default; arrows avoid prefix+shift+k (kate)
swap_pane_left = "prefix+shift+left"
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"

[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "ports"
description = "ports"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+shift+k"
type = "popup"
command = "kate"
description = "kate (kubernetes)"
width = "95%"
height = "90%"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit"
width = "90%"
height = "90%"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
accent = "magenta"
copy_on_select = false

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[experimental]
pane_history = false
